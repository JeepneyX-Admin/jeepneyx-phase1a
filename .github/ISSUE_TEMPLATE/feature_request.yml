name: Feature request
about: Request a new feature for JeepneyX website
title: "feat: "
labels:
  - enhancement
body:
  - type: input
    id: summary
    attributes:
      label: Feature summary
      description: Short description of the feature requested by the client.
      placeholder: Add model comparison section on company page
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user/client problem does this solve?
      placeholder: Client wants visitors to quickly compare EV model capabilities.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Requested outcome
      description: Describe what should be visible/working when done.
      placeholder: Add comparison cards with key specs and CTA to inquiry form.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List clear, testable conditions.
      value: |
        - [ ] Implemented on development branch
        - [ ] Mobile and desktop responsive
        - [ ] CTA links are correct
        - [ ] Content approved by client
        - [ ] PR created from development to main
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Phase context
      options:
        - Phase 1A
        - Phase 1B
        - Phase 2
        - Phase 3
        - Phase 4
        - General
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High
        - Medium
        - Low
    validations:
      required: true
